[pytest]
# Корневая директория проекта — добавляется в sys.path
pythonpath = .

# Режим asyncio: strict (явные декораторы @pytest.mark.asyncio)
# Если хотите автоматический режим без декораторов — используйте:
# asyncio_mode = auto
asyncio_mode = strict

# Директории, в которых искать тесты
testpaths = tests

# Минимальная версия pytest-asyncio
addopts = -v --tb=short