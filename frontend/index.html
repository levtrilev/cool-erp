<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>frontend</title>
    <script>
      (function () {
        try {
          var pairs = document.cookie.split("; ");
          function cookie(name) {
            for (var i = 0; i < pairs.length; i++) {
              if (pairs[i].indexOf(name + "=") === 0) {
                return decodeURIComponent(pairs[i].slice(name.length + 1));
              }
            }
            return null;
          }
          // Миграция: пока cookie не заведены, берём прежний выбор из localStorage.
          function legacy(name) {
            try {
              return window.localStorage.getItem(name);
            } catch (e) {
              return null;
            }
          }
          var PALETTES = [
            "sepia",
            "onedark",
            "nord",
            "ghdimmed",
            "catppuccin",
            "solarized",
          ];
          var theme = cookie("cool-erp-theme") || legacy("cool-erp-theme");
          var lightPalette =
            cookie("cool-erp-light-palette") ||
            legacy("cool-erp-light-palette");
          var darkPalette =
            cookie("cool-erp-dark-palette") ||
            legacy("cool-erp-dark-palette") ||
            legacy("cool-erp-palette");
          var dark;
          if (theme === "dark") dark = true;
          else if (theme === "light") dark = false;
          else dark = window.matchMedia("(prefers-color-scheme: dark)").matches;
          var palette = dark ? darkPalette : lightPalette;
          var root = document.documentElement;
          root.classList.toggle("dark", dark);
          for (var i = 0; i < PALETTES.length; i++) {
            root.classList.remove("palette-" + PALETTES[i]);
          }
          if (
            palette &&
            palette !== "default" &&
            PALETTES.indexOf(palette) !== -1
          ) {
            root.classList.add("palette-" + palette);
          }
          root.style.colorScheme = dark ? "dark" : "light";
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
